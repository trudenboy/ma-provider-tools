name: Distribute Wrappers to Provider Repos

on:
  push:
    branches: [main]
    paths:
      - "wrappers/**"
      - "providers.yml"
      - "upstream-guidance/**"
  workflow_dispatch:

# Back-to-back merges to main start overlapping runs that force-push the same
# chore/update-workflow-wrappers branches and race on auto-merge. Queue them;
# a run that is still pending is replaced by the newest one, which renders
# from the latest main anyway.
concurrency:
  group: distribute-wrappers
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jinja2 pyyaml

      - name: Distribute wrappers
        run: python3 scripts/distribute.py
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
